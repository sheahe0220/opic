<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>오픽 말하기 훈련소</title>
<style>
/* OPIc speaking trainer (2026-11-19). Mobile first; one task per screen; big tap targets.
   Colours: Radix slate + indigo (listen) + orange (speak), same family as the TOEIC site. */
:root{--bg:#f0f0f3;--surface:#fcfcfd;--sunk:#e8e8ec;--line:#d9d9e0;--ink:#1c2024;--ink-2:#60646c;
  --accent:#cc4e00;--accent-solid:#cc4e00;--accent-ink:#fff;--accent-soft:#ffefd6;--navy:#3a5bc7;--navy-solid:#3e63dd;--navy-ink:#fff;--navy-soft:#edf2fe;
  --ok:#218358;--ok-bg:#e6f6eb;--no:#ce2c31;--no-bg:#feebec;--warn:#ab6400;--warn-bg:#fff7c2;
  --sans:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;--serif:Georgia,"Times New Roman",serif;--mono:ui-monospace,Consolas,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#111113;--surface:#18191b;--sunk:#212225;--line:#363a3f;--ink:#edeef0;--ink-2:#b0b4ba;
  --accent:#ffa057;--accent-solid:#f76b15;--accent-ink:#17120e;--accent-soft:#331e0b;--navy:#9eb1ff;--navy-solid:#9eb1ff;--navy-ink:#11131f;--navy-soft:#182449;
  --ok:#3dd68c;--ok-bg:#132d21;--no:#ff9592;--no-bg:#3b1219;--warn:#ffca16;--warn-bg:#302008;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.65;word-break:keep-all;overflow-wrap:break-word;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:680px;margin:0 auto;padding:0 16px 110px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:max(10px,env(safe-area-inset-top)) 0 0;border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:10px}
.hrow h1{font-size:18px;margin:0;flex:1;white-space:nowrap}
.hstat{font-family:var(--mono);font-size:13px;color:var(--ink-2)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-top:6px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:transparent;padding:8px 11px 10px;cursor:pointer;color:var(--ink-2);font-size:14.5px;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
main{margin-top:14px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h2{margin:0 0 8px;font-size:18px}.card h3{margin:12px 0 6px;font-size:16px}
.muted{color:var(--ink-2);font-size:14.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{min-height:46px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 15px;cursor:pointer;font-weight:600;font-size:15.5px}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent-solid);border-color:var(--accent-solid);color:var(--accent-ink)}
.btn.navy{background:var(--navy-solid);border-color:var(--navy-solid);color:var(--navy-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2);font-weight:500}
.btn.rec{background:var(--no);border-color:var(--no);color:#fff}
.btn[disabled]{opacity:.4}
.btn.wide{width:100%}
.seg{display:flex;gap:4px;background:var(--sunk);border-radius:12px;padding:4px;overflow-x:auto;scrollbar-width:none}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 10px;cursor:pointer;white-space:nowrap;font-size:14.5px;color:var(--ink-2)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;cursor:pointer;font-size:14px}
.chip[aria-pressed=true]{background:var(--navy-soft);border-color:var(--navy);color:var(--navy);font-weight:700}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:92px}
.tile b{font-size:16px}.tile span{font-size:13.5px;color:var(--ink-2)}
.tile.go{background:var(--accent-soft);border-color:var(--accent)}
.ava{display:flex;gap:12px;align-items:center}
.ava .face{flex:none;width:56px;height:56px;border-radius:99px;background:var(--navy-soft);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--navy);font-size:20px}
.ava.talk .face{box-shadow:0 0 0 4px var(--navy)}
.ava.listen .face{box-shadow:0 0 0 4px var(--accent)}
.qtext{font-family:var(--serif);font-size:18px;line-height:1.6}
.pill{display:inline-block;font-size:12.5px;border-radius:99px;padding:1px 10px;background:var(--sunk);color:var(--ink-2)}
.pill.navy{background:var(--navy-soft);color:var(--navy)}.pill.acc{background:var(--accent-soft);color:var(--accent)}
.meter{height:10px;background:var(--sunk);border-radius:99px;overflow:hidden}.meter i{display:block;height:100%;background:var(--accent);width:0;transition:width .05s}
.big{font-family:var(--mono);font-size:30px;font-weight:700}
.live{font-family:var(--serif);font-size:16px;background:var(--sunk);border-radius:10px;padding:10px 12px;min-height:48px}
.fb{display:flex;flex-direction:column;gap:6px}
.fb div{border-radius:10px;padding:8px 12px;font-size:15px}
.fb .ok{background:var(--ok-bg)}.fb .warn{background:var(--warn-bg)}.fb .no{background:var(--no-bg)}
table.m{width:100%;border-collapse:collapse;font-size:14.5px}
table.m td,table.m th{padding:6px 4px;border-top:1px solid var(--line);text-align:left}
table.m th{color:var(--ink-2);font-weight:600;border-top:0}
.ans{font-family:var(--serif);font-size:16.5px;line-height:1.7;background:var(--sunk);border-radius:10px;padding:10px 12px}
pre.doc{white-space:pre-wrap;font-family:var(--serif);font-size:15.5px;line-height:1.65;background:var(--sunk);border-radius:10px;padding:10px 12px;margin:6px 0}
.docmd p{margin:4px 0}.docmd h4{margin:10px 0 4px;font-size:15px}
textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface);font-family:var(--serif);font-size:16px;line-height:1.6}
input[type=password],input[type=text],input[type=search],select{min-height:46px;border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--surface);width:100%}
.recitem{border-top:1px solid var(--line);padding:10px 0}
.recitem:first-child{border-top:0}
audio{width:100%;height:40px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14.5px;z-index:9;max-width:90vw}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:6}
.foot .in{max-width:680px;margin:0 auto;display:flex;gap:8px}
.foot .btn{flex:1}
.word-miss{background:var(--no-bg);border-radius:4px;padding:0 2px}
.word-hit{background:var(--ok-bg);border-radius:4px;padding:0 2px}
svg.chart{width:100%;height:140px}
</style>
</head>

<script>

(function(){
var D=window.OPIC||{q:[],m:[],f:[],e:[]};
var T15N=["자기소개","활동묘사","최근경험","사물묘사","인물묘사","장소묘사","시간순서","준비물","첫 계기","특별한 경험","에바에게 질문하기","3-4가지 질문하기","문제해결 · 대안제시","유사 경험","과거와 현재 비교","이슈 · 문제점"];
var T15TYPE={0:"intro",1:"describe",2:"past",3:"describe",4:"describe",5:"describe",6:"routine",7:"routine",8:"past",9:"past",10:"ask_ava",11:"ask_questions",12:"solve_problem",13:"related_experience",14:"compare",15:"issue"};
var T15CAT={0:"intro",10:"ask_ava",11:"roleplay",12:"roleplay",13:"roleplay",14:"advanced",15:"advanced"};
var SURVEY_DEF=["집","영화보기","공연 · 콘서트","공원","해변","카페","음악 감상","조깅 · 걷기","자전거","집에서 보내는 휴가","국내여행","해외여행"];
// Background Survey as in the academy textbook ('[2026] OPIc 15유형 프레임' 서베이 항목, red = recommended -> 1).
// option: [label, recommended, bank topic key in SURVEY_DEF or none]. user 2026-11-26 '주제도 내가 고를 수 있게'
var BS_FORM=[
 {k:"job",n:"1. 현재 어느 분야에 종사하고 계십니까?",one:1,o:[["사업/회사"],["재택근무/재택사업"],["교사/교육자"],["군복무"],["일 경험 없음",1]]},
 {k:"stu",n:"2. 현재 학생이십니까?",one:1,o:[["네"],["아니오",1]]},
 {k:"cls",n:"2-1. 예전에 들었던 강의 목적은 무엇입니까?",one:1,when:function(b){return b.stu==="아니오"},o:[["학위 과정 수업"],["전문 기술 향상을 위한 평생 학습"],["어학 수업"],["수강 후 5년 이상 지남",1]]},
 {k:"home",n:"3. 현재 어디에 살고 계십니까?",one:1,o:[["개인주택이나 아파트에 홀로 거주",1,"집"],["친구나 룸메이트와 함께 주택이나 아파트에 거주",0,"집"],["가족(배우자/자녀/기타 가족 일원)과 함께 주택이나 아파트에 거주",0,"집"],["학교 기숙사"],["군대 막사"]]},
 {k:"p4",n:"4. 여가 활동으로 주로 무엇을 하십니까? (두 개 이상)",o:[["영화보기",1,"영화보기"],["클럽/나이트클럽 가기"],["공연보기",1,"공연 · 콘서트"],["콘서트 보기",1,"공연 · 콘서트"],["박물관가기"],["공원 가기",1,"공원"],["캠핑하기"],["해변가기",1,"해변"],["스포츠 관람"],["주거개선"],["술집/바에 가기"],["카페/커피전문점 가기",1,"카페"],["게임 하기(비디오, 카드, 보드, 휴대폰 등)"],["당구치기"],["체스 하기"],["SNS에 글 올리기"],["친구들과 문자대화하기"],["시험 대비 과정 수강하기"],["TV보기"],["리얼리티 쇼 시청하기"],["뉴스를 보거나 듣기"],["요리 관련 프로그램 시청하기"],["쇼핑하기"],["차로 드라이브하기"],["스파/마사지 샵 가기"],["구직활동하기"],["자원봉사하기"]]},
 {k:"p5",n:"5. 취미나 관심사는 무엇입니까? (한 개 이상)",o:[["아이에게 책 읽어주기"],["음악 감상하기",1,"음악 감상"],["악기 연주하기"],["글쓰기(편지, 단문, 시 등)"],["그림 그리기"],["요리하기"],["애완동물 기르기"],["독서"],["춤추기"],["주식 투자하기"],["신문 읽기"],["여행 관련 잡지나 블로그 읽기"],["사진 촬영하기"],["혼자 노래 부르거나 합창하기"]]},
 {k:"p6",n:"6. 주로 어떤 운동을 즐기십니까? (한 개 이상)",o:[["농구"],["야구/소프트볼"],["미식축구"],["하키"],["크로켓"],["골프"],["배구"],["테니스"],["배드민턴"],["탁구"],["수영"],["자전거",0,"자전거"],["스키/스노우 보드"],["아이스 스케이트"],["조깅",1,"조깅 · 걷기"],["걷기",1,"조깅 · 걷기"],["요가"],["하이킹/트레킹"],["낚시"],["헬스"],["태권도"],["운동 수업 수강하기"],["운동을 전혀 하지 않음"]]},
 {k:"p7",n:"7. 어떤 휴가나 출장을 다녀온 경험이 있습니까? (한 개 이상)",o:[["국내출장"],["해외출장"],["집에서 보내는 휴가",1,"집에서 보내는 휴가"],["국내여행",1,"국내여행"],["해외여행",1,"해외여행"]]}];
function bsDefault(){var b={};BS_FORM.forEach(function(p){var r=p.o.filter(function(o){return o[1]}).map(function(o){return o[0]});b[p.k]=p.one?(r[0]||p.o[0][0]):r});return b}
function bsOpt(p,label){return p.o.filter(function(o){return o[0]===label})[0]}
function bsMulti(b){var n=0;["p4","p5","p6","p7"].forEach(function(k){n+=(b[k]||[]).length});return n}
// topic keys (SURVEY_DEF) the chosen survey items cover; questions come only from these
function bsTopics(b){var on={};BS_FORM.forEach(function(p){if(p.when&&!p.when(b))return;var v=b[p.k];(p.one?[v]:(v||[])).forEach(function(l){var o=bsOpt(p,l);if(o&&o[2])on[o[2]]=1})});return SURVEY_DEF.filter(function(t){return on[t]})}
// map a bank or academy topic name to one SURVEY_DEF key (exact rules; the old 2-letter match tied 집 to 집에서 보내는 휴가)
function topicKey(tk){var n=String(tk||"").replace(/\s|·/g,"");
  if(/명절|집값|문화|정책|저작권|스트리밍/.test(n))return null;
  if(/자전거|cycling/.test(n))return "자전거";
  if(/집에서|휴가/.test(n))return "집에서 보내는 휴가";if(/^집|거주|동네/.test(n))return "집";
  if(/영화/.test(n))return "영화보기";if(/공연|콘서트/.test(n))return "공연 · 콘서트";if(/공원/.test(n))return "공원";if(/해변|바다/.test(n))return "해변";
  if(/카페|커피/.test(n))return "카페";if(/음악/.test(n))return "음악 감상";if(/조깅|걷기|산책/.test(n))return "조깅 · 걷기";
  if(/국내여행/.test(n))return "국내여행";if(/해외여행/.test(n))return "해외여행";return null}
// ---------- state ----------
var KEY="opic.v1";
function load(){var s;try{s=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){s=null}s=s||{};
  s.set=Object.assign({voice:"",rate:0.95,level:5,src:"mix",survey:SURVEY_DEF.slice(),liveSR:true,showText:false,whisper:"Xenova/whisper-tiny.en"},s.set||{});
  if(!s.set.bs)s.set.bs=bsDefault();s.set.survey=bsTopics(s.set.bs);
  s.scripts=s.scripts||{};s.known=s.known||{};s.log=s.log||{};s.seen=s.seen||{};return s}
var S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("기기 저장 공간이 부족합니다")}}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function logAdd(sec){var t=today(),L=S.log[t]||{n:0,sec:0};L.n++;L.sec+=sec;S.log[t]=L;save();hstat()}
// ---------- IndexedDB for recordings ----------
var DBP=null;
function db(){if(DBP)return DBP;DBP=new Promise(function(ok,no){try{var r=indexedDB.open("opic",1);r.onupgradeneeded=function(){r.result.createObjectStore("rec",{keyPath:"id"})};r.onsuccess=function(){ok(r.result)};r.onerror=function(){no(r.error)}}catch(e){no(e)}});return DBP}
function tx(mode,fn){return db().then(function(d){return new Promise(function(ok,no){var t=d.transaction("rec",mode),st=t.objectStore("rec"),out=fn(st);t.oncomplete=function(){ok(out&&out.result!==undefined?out.result:out)};t.onerror=function(){no(t.error)}})})}
function recPut(x){return tx("readwrite",function(st){return st.put(x)})}
function recAll(){return tx("readonly",function(st){return st.getAll()})}
function recDel(id){return tx("readwrite",function(st){return st.delete(id)})}
function recGet(id){return tx("readonly",function(st){return st.get(id)})}
// ---------- dom ----------
function h(tag,p){var e=document.createElement(tag);if(p)for(var k in p){var v=p[k];if(v==null||v===false)continue;
  if(k==="class")e.className=v;else if(k.slice(0,2)==="on")e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?"":v)}
  for(var i=2;i<arguments.length;i++){var c=arguments[i];if(c==null||c===false)continue;(Array.isArray(c)?c:[c]).forEach(function(x){if(x!=null&&x!==false)e.append(x.nodeType?x:document.createTextNode(String(x)))})}return e}
var M=document.getElementById("main"),FOOT=document.getElementById("foot"),FIN=document.getElementById("footIn");
function clear(e){while(e.firstChild)e.removeChild(e.firstChild);return e}
var toastT;function toast(m){var o=document.querySelector(".toast");if(o)o.remove();var t=h("div",{class:"toast",role:"status"},m);document.body.append(t);clearTimeout(toastT);toastT=setTimeout(function(){t.remove()},2600)}
function foot(btns){clear(FIN);btns=(btns||[]).filter(Boolean);if(!btns.length){FOOT.hidden=true;return}FOOT.hidden=false;btns.forEach(function(b){FIN.append(b)})}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function mmss(s){s=Math.max(0,Math.round(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function hstat(){var L=S.log[today()]||{n:0,sec:0};document.getElementById("hstat").textContent="오늘 "+L.n+"개 · "+Math.round(L.sec/60)+"분"}
// ---------- speech out (Ava) ----------
var VOICES=[];function loadVoices(){try{VOICES=speechSynthesis.getVoices().filter(function(v){return/^en/i.test(v.lang)})}catch(e){VOICES=[]}}
try{loadVoices();speechSynthesis.onvoiceschanged=loadVoices}catch(e){}
function avaVoice(){if(S.set.voice){var v=VOICES.filter(function(x){return x.name===S.set.voice})[0];if(v)return v}
