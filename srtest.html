<!doctype html>
<!--
  srtest_v1.html : phone check for speech recognition, recording and English TTS voices (영어3, 2026-11-27).
  Why: the O2 benchmark design (word coloring after speaking) depends on SpeechRecognition working on the user's phone.
  This page prints what the phone browser actually does so the user can paste the result into chat.
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>말하기 인식 시험</title>
<style>
:root{--bg:#ffffff;--fg:#16181d;--muted:#5b6170;--card:#f3f4f6;--line:#d9dce1;--ok:#13803d;--okbg:#dcf5e5;--bad:#b42318;--badbg:#fde4e1;--btn:#1d4ed8;--btnfg:#ffffff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121417;--fg:#edeef0;--muted:#a4a9b3;--card:#1d2026;--line:#30343c;--ok:#5bd38a;--okbg:#173524;--bad:#ff8a80;--badbg:#3d1c1a;--btn:#3b6cf0;--btnfg:#ffffff}}
:root[data-theme="dark"]{--bg:#121417;--fg:#edeef0;--muted:#a4a9b3;--card:#1d2026;--line:#30343c;--ok:#5bd38a;--okbg:#173524;--bad:#ff8a80;--badbg:#3d1c1a;--btn:#3b6cf0;--btnfg:#ffffff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.55 system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 4px}
p.help{color:var(--muted);margin:0 0 14px;font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.sent{font-size:22px;line-height:1.45;font-weight:600;word-break:break-word}
.sent span{border-radius:6px;padding:0 2px}
.sent .ok{color:var(--ok);background:var(--okbg)}
.sent .bad{color:var(--bad);background:var(--badbg)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
button{font:inherit;font-size:16px;border:0;border-radius:12px;padding:12px 14px;background:var(--btn);color:var(--btnfg);min-height:48px;flex:1 1 auto}
button.sub{background:transparent;color:var(--fg);border:1px solid var(--line)}
button:disabled{opacity:.5}
.label{font-size:13px;color:var(--muted);margin:0 0 4px}
.heard{font-size:18px;min-height:1.6em;word-break:break-word}
.interim{color:var(--muted)}
.score{font-size:15px;margin-top:6px}
pre{white-space:pre-wrap;word-break:break-word;font-size:13px;line-height:1.45;margin:0;max-height:260px;overflow:auto}
audio{width:100%;margin-top:10px}
.status{font-size:15px;margin-top:8px;color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>말하기 인식 시험</h1>
  <p class="help">문장을 소리 내어 읽으면 폰이 받아쓴 글과 맞은 단어(초록) · 틀린 단어(빨강)를 보여 줍니다. 다섯 문장을 해 본 뒤 [결과 복사]를 눌러 채팅에 붙여 주세요.</p>

  <div class="card">
    <div class="label" id="sentNo">문장 1 / 5</div>
    <div class="sent" id="sent"></div>
    <div class="row">
      <button id="btnSpeak">말하기</button>
      <button class="sub" id="btnListen">문장 듣기</button>
      <button class="sub" id="btnNext">다음 문장</button>
    </div>
    <div class="status" id="status">버튼을 누르면 마이크 허용을 묻습니다.</div>
  </div>

  <div class="card">
    <div class="label">받아쓴 글</div>
    <div class="heard"><span id="final"></span> <span class="interim" id="interim"></span></div>
    <div class="score" id="score"></div>
  </div>

  <div class="card">
    <div class="label">녹음 5초 시험</div>
    <div class="row">
      <button class="sub" id="btnRec">5초 녹음</button>
    </div>
    <audio id="player" controls hidden></audio>
    <div class="status" id="recStatus"></div>
  </div>

  <div class="row" style="margin:0 0 12px">
    <button id="btnCopy">결과 복사</button>
  </div>

  <div class="card">
    <div class="label">기록</div>
    <pre id="log"></pre>
  </div>
</main>
<script>
(function () {
  "use strict";
  var SENTS = [
    "I usually take a walk around the lake after dinner.",
    "One of my favorite places to visit is a small cafe inside my school.",
    "I bought my earbuds a few years ago during a big sale.",
    "Could I get a full refund and book the next weekend instead?",
    "In the end, the staff found my wallet and gave it back to me."
  ];
  var idx = 0;
  var t0 = performance.now();
  var lines = [];
  var trials = [];
  var $ = function (id) { return document.getElementById(id); };

  function ms() { return Math.round(performance.now() - t0); }
  function log(s) { lines.push("[" + ms() + "ms] " + s); $("log").textContent = lines.join("\n"); }
  function words(s) { return s.toLowerCase().replace(/[^a-z0-9' ]+/g, " ").split(/\s+/).filter(Boolean); }

  // longest common subsequence: which target words were heard, in order
  function match(target, heard) {
    var n = target.length, m = heard.length, i, j;
    var d = [];
    for (i = 0; i <= n; i++) { d.push(new Array(m + 1).fill(0)); }
    for (i = n - 1; i >= 0; i--) for (j = m - 1; j >= 0; j--)
      d[i][j] = target[i] === heard[j] ? d[i + 1][j + 1] + 1 : Math.max(d[i + 1][j], d[i][j + 1]);
    var ok = new Array(n).fill(false); i = 0; j = 0;
    while (i < n && j < m) {
      if (target[i] === heard[j]) { ok[i] = true; i++; j++; }
      else if (d[i + 1][j] >= d[i][j + 1]) i++; else j++;
    }
    return ok;
  }

  function showSentence(ok) {
    var raw = SENTS[idx].split(" ");
    var el = $("sent"); el.innerHTML = "";
    raw.forEach(function (w, k) {
      var s = document.createElement("span");
      s.textContent = w;
      if (ok) s.className = ok[k] ? "ok" : "bad";
      el.appendChild(s); el.appendChild(document.createTextNode(" "));
    });
    $("sentNo").textContent = "문장 " + (idx + 1) + " / " + SENTS.length;
  }

  // environment
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  log("userAgent: " + navigator.userAgent);
  log("SpeechRecognition: " + (window.SpeechRecognition ? "있음" : "없음") + ", webkitSpeechRecognition: " + (window.webkitSpeechRecognition ? "있음" : "없음"));
  log("MediaRecorder: " + (window.MediaRecorder ? "있음" : "없음"));
  if (window.MediaRecorder && MediaRecorder.isTypeSupported) {
    var types = ["audio/webm", "audio/webm;codecs=opus", "audio/mp4", "audio/ogg;codecs=opus", "audio/wav"];
    log("MediaRecorder 형식: " + types.map(function (t) { return t + "=" + (MediaRecorder.isTypeSupported(t) ? "O" : "X"); }).join(", "));
  }
  log("speechSynthesis: " + ("speechSynthesis" in window ? "있음" : "없음"));

  var voicesLogged = false;
  function listVoices() {
    if (!("speechSynthesis" in window)) return;
    var v = speechSynthesis.getVoices();
    if (!v.length || voicesLogged) return;
    voicesLogged = true;
    var en = v.filter(function (x) { return /^en[-_]/i.test(x.lang); });
    log("영어 음성 " + en.length + "개 / 전체 " + v.length + "개: " + en.map(function (x) { return x.name + " (" + x.lang + (x.localService ? ", 기기" : ", 망") + ")"; }).join("; "));
  }
  if ("speechSynthesis" in window) {
    listVoices();
    speechSynthesis.onvoiceschanged = listVoices;
    setTimeout(listVoices, 1500);
  }

  showSentence(null);

  // speech recognition
  var rec = null, running = false, tStart = 0;
  if (!SR) {
    $("btnSpeak").disabled = true;
    $("status").textContent = "이 브라우저에는 음성 인식이 없습니다. 녹음 시험만 해 주세요.";
  }
  $("btnSpeak").onclick = function () {
    if (running) { rec && rec.stop(); return; }
    rec = new SR();
    rec.lang = "en-US"; rec.continuous = false; rec.interimResults = true; rec.maxAlternatives = 1;
    $("final").textContent = ""; $("interim").textContent = ""; $("score").textContent = "";
    showSentence(null);
    var finalText = "", conf = null, gotResult = false;
    ["audiostart", "soundstart", "speechstart", "speechend", "soundend", "audioend", "nomatch"].forEach(function (ev) {
      rec["on" + ev] = function () { log("문장" + (idx + 1) + " " + ev); };
    });
    rec.onstart = function () { running = true; tStart = performance.now(); $("btnSpeak").textContent = "그만"; $("status").textContent = "듣는 중... 문장을 읽어 주세요."; log("문장" + (idx + 1) + " start (lang en-US)"); };
    rec.onresult = function (e) {
      var fin = "", inter = "";
      for (var i = 0; i < e.results.length; i++) {
        var r = e.results[i];
        if (r.isFinal) { fin += r[0].transcript; conf = r[0].confidence; } else { inter += r[0].transcript; }
      }
      if (fin) { finalText = fin; gotResult = true; }
      $("final").textContent = finalText; $("interim").textContent = inter;
      if (inter) log("문장" + (idx + 1) + " 중간: " + inter);
    };
    rec.onerror = function (e) { log("문장" + (idx + 1) + " error: " + e.error + (e.message ? " / " + e.message : "")); $("status").textContent = "오류: " + e.error; };
    rec.onend = function () {
      running = false; $("btnSpeak").textContent = "말하기";
      var took = Math.round(performance.now() - tStart);
      var target = words(SENTS[idx]);
      var ok = match(target, words(finalText));
      var hit = ok.filter(Boolean).length;
      showSentence(ok);
      var line = "문장" + (idx + 1) + " end: " + took + "ms, 맞은 단어 " + hit + "/" + target.length + ", confidence " + (conf === null ? "없음" : conf.toFixed(2)) + ", 받아쓴 글: \"" + finalText + "\"";
      log(line);
      trials.push(line);
      $("score").textContent = gotResult ? "맞은 단어 " + hit + " / " + target.length + " · " + (took / 1000).toFixed(1) + "초" : "받아쓴 글이 없습니다.";
      $("status").textContent = "끝. [다음 문장]으로 넘어가세요.";
    };
    try { rec.start(); } catch (err) { log("start 실패: " + err.name + " " + err.message); }
  };

  $("btnNext").onclick = function () {
    if (running && rec) rec.abort();
    idx = (idx + 1) % SENTS.length;
    $("final").textContent = ""; $("interim").textContent = ""; $("score").textContent = "";
    $("status").textContent = "";
    showSentence(null);
  };

  $("btnListen").onclick = function () {
    if (!("speechSynthesis" in window)) { log("speechSynthesis 없음"); return; }
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(SENTS[idx]);
    u.lang = "en-US"; u.rate = 0.95;
    var en = speechSynthesis.getVoices().filter(function (x) { return /^en-US/i.test(x.lang); });
    if (en.length) u.voice = en.find(function (x) { return x.localService; }) || en[0];
    u.onstart = function () { log("문장 듣기: " + (u.voice ? u.voice.name : "기본 음성")); };
    u.onerror = function (e) { log("문장 듣기 오류: " + e.error); };
    speechSynthesis.speak(u);
  };

  // 5-second recording
  $("btnRec").onclick = function () {
    if (!navigator.mediaDevices || !window.MediaRecorder) { $("recStatus").textContent = "이 브라우저는 녹음을 지원하지 않습니다."; log("녹음: 지원 안 함"); return; }
    $("btnRec").disabled = true; $("recStatus").textContent = "마이크 허용 후 5초 동안 녹음합니다...";
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      var mr = new MediaRecorder(stream), chunks = [];
      mr.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
      mr.onstop = function () {
        stream.getTracks().forEach(function (t) { t.stop(); });
        var blob = new Blob(chunks, { type: mr.mimeType || "audio/webm" });
        var p = $("player"); p.src = URL.createObjectURL(blob); p.hidden = false;
        $("recStatus").textContent = "녹음 끝. 위 재생 버튼으로 들어 보세요.";
        log("녹음 끝: 형식 " + (mr.mimeType || "알 수 없음") + ", 크기 " + blob.size + " bytes");
        $("btnRec").disabled = false;
      };
      mr.start(); log("녹음 시작: 형식 " + (mr.mimeType || "알 수 없음"));
      setTimeout(function () { if (mr.state !== "inactive") mr.stop(); }, 5000);
    }).catch(function (err) {
      $("recStatus").textContent = "마이크를 쓸 수 없습니다: " + err.name; log("녹음 오류: " + err.name + " " + err.message);
      $("btnRec").disabled = false;
    });
  };

  // copy result
  $("btnCopy").onclick = function () {
    var text = "말하기 인식 시험 결과\n" + lines.join("\n");
    function done() { $("btnCopy").textContent = "복사했습니다"; setTimeout(function () { $("btnCopy").textContent = "결과 복사"; }, 2000); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, fallback);
    } else { fallback(); }
    function fallback() {
      var ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); done(); } catch (e) { $("btnCopy").textContent = "복사 실패: 기록을 길게 눌러 복사"; }
      document.body.removeChild(ta);
    }
  };
})();
</script>
</body>
</html>
